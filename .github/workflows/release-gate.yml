name: Aikido Gates

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Aikido CLI
        run: npm install -g @aikidosec/ci-api-client

      - name: Gate de codigo
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          aikido-api-client scan-release "AK-REP-BACK" "${{ github.sha }}" \
            --apikey "$AIKIDO_API_KEY" \
            --fail-on-sast-scan \
            --fail-on-iac-scan \
            --fail-on-secrets-scan \
            --minimum-severity-level "HIGH" \
            --json

  container-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t ak-rep-back:${{ github.sha }} .

      - name: Gate de contenedor
        env:
          AIKIDO_IMAGE_KEY: ${{ secrets.AIKIDO_IMAGE_KEY }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aikidosecurity/local-scanner \
            image-scan ak-rep-back:${{ github.sha }} \
            --apikey "$AIKIDO_IMAGE_KEY" \
            --fail-on critical

  deploy:
    needs: [security-gate, container-gate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Aqui iria tu despliegue real"